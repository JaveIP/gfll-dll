name: Build GfLL DLL
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build DLL
        run: msbuild gfll.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Upload Compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: gfll-dll-release
          path: "**/*.dll"
